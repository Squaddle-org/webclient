# Replaces nginxinc/nginx-unprivileged's default server block (see Dockerfile).
# No $remote_addr anywhere in the log format - same privacy posture as website/nginx.conf.
log_format noip '$time_iso8601 "$request" $status $body_bytes_sent "$http_user_agent"';

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    access_log /dev/stdout noip;

    # nginx's bundled mime.types doesn't include .wasm - without this, sql.js's
    # WebAssembly.instantiateStreaming (StorageApi.preloadSqlJsDriver) falls back to a slower
    # ArrayBuffer path instead of failing outright, but it should still be served correctly.
    types {
        application/wasm wasm;
    }

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # script-src needs 'wasm-unsafe-eval' for sql.js's and libsodium's WASM (ADR-0009) - no
    # plain 'unsafe-eval', nothing remotely loaded. connect-src can't be scoped to 'self': the
    # relay host is user-configurable (webclient/CLAUDE.md), so any HTTPS/WSS origin must be
    # reachable, not just this one.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; connect-src https: wss:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Every app route (incl. /j/* - router.ts's own join-link entry point, and /rooms/:id etc.)
    # is client-side; a hard reload/direct link on any of them needs index.html, not a 404.
    location / {
        try_files $uri /index.html;
    }
}
