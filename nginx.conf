# Replaces nginxinc/nginx-unprivileged's default server block (see Dockerfile).
# No $remote_addr anywhere in the log format - same privacy posture as website/nginx.conf.
log_format noip '$time_iso8601 "$request" $status $body_bytes_sent "$http_user_agent"';

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    access_log /dev/stdout noip;

    # A bare `types {}` block REPLACES nginx's entire MIME map for this context, not merges
    # into it - declaring only wasm here (as an earlier version of this file did) meant every
    # other file, index.html included, fell back to application/octet-stream and browsers
    # downloaded the page instead of rendering it. Load the real map first, then layer wasm's
    # content-type on top via a location (default_type doesn't have this replace-the-whole-map
    # footgun - it only ever applies where mime.types found no match).
    include /etc/nginx/mime.types;

    location ~* \.wasm$ {
        default_type application/wasm;
        try_files $uri =404;
    }

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # script-src needs 'wasm-unsafe-eval' for sql.js's and libsodium's WASM (ADR-0009) - no
    # plain 'unsafe-eval', nothing remotely loaded. connect-src can't be scoped to 'self': the
    # relay host is user-configurable (webclient/CLAUDE.md), so any HTTPS/WSS origin must be
    # reachable, not just this one.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; connect-src https: wss:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Every app route (incl. /j/* - router.ts's own join-link entry point, and /rooms/:id etc.)
    # is client-side; a hard reload/direct link on any of them needs index.html, not a 404.
    location / {
        try_files $uri /index.html;
    }
}
